<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">College Cleanliness Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg" th:fragment="navbar(user)">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="fas fa-leaf"></i> Campus Cleaning
            </a>
            <button class="navbar-toggler mobile-menu-toggle" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fas fa-bars text-white"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/notifications}">
                            <i class="fas fa-bell"></i> Notifications
                            <span th:if="${unreadCount > 0}" class="notification-badge" th:text="${unreadCount}">0</span>
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle"></i> <span th:text="${user.fullName}">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/logout}"><i class="fas fa-sign-out-alt me-2"></i> Logout</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="sidebar" th:fragment="sidebar(user)">
        <div class="sidebar-user">
            <div class="user-avatar">
                <i class="fas fa-user"></i>
            </div>
            <h6 th:text="${user.fullName}">User Name</h6>
            <small th:each="role : ${user.roles}" th:text="${role.name}">ROLE</small>
        </div>
        
        <!-- Student Menu -->
        <div th:if="${#sets.contains(user.roles.^[name=='STUDENT'], true)} or ${#sets.size(#sets.intersection(user.roles, {'ADMIN','STAFF'})) == 0}">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/student/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/student/complaint/new}"><i class="fas fa-plus-circle"></i> New Complaint</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/student/complaints}"><i class="fas fa-list"></i> My Complaints</a></li>
            </ul>
        </div>
        
        <!-- Staff Menu -->
        <div th:if="${#sets.contains(user.roles.^[name=='STAFF'], true)}">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/staff/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/staff/complaints}"><i class="fas fa-tasks"></i> Assigned Tasks</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/staff/complaints(status=ASSIGNED)}"><i class="fas fa-clock"></i> Pending Tasks</a></li>
            </ul>
        </div>
        
        <!-- Admin Menu -->
        <div th:if="${#sets.contains(user.roles.^[name=='ADMIN'], true)}">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}"><i class="fas fa-users"></i> Manage Users</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/complaints}"><i class="fas fa-list"></i> All Complaints</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/reports}"><i class="fas fa-chart-bar"></i> Reports</a></li>
            </ul>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</body>
</html>
