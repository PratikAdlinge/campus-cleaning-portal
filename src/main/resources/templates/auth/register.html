<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Campus Cleaning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-icon">
                <i class="fas fa-leaf"></i>
            </div>
            <h3>Create Account</h3>
            <p class="subtitle">Join our Campus Cleaning System</p>
            
            <form th:action="@{/register}" th:object="${user}" method="post">
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-user"></i> Full Name</label>
                    <input type="text" th:field="*{fullName}" class="form-control" placeholder="Enter your full name" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-envelope"></i> Email Address</label>
                    <input type="email" th:field="*{email}" class="form-control" placeholder="Enter your email" required>
                    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-lock"></i> Password</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Enter password" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="text" th:field="*{phone}" class="form-control" placeholder="Enter phone number">
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-building"></i> Department</label>
                    <input type="text" th:field="*{department}" class="form-control" placeholder="Enter department">
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-id-card"></i> Roll Number (Students)</label>
                    <input type="text" th:field="*{rollNumber}" class="form-control" placeholder="Enter roll number">
                </div>
                
                <div class="form-group">
                    <label class="form-label"><i class="fas fa-user-tag"></i> Register As</label>
                    <select name="role" class="form-select">
                        <option value="STUDENT">Student</option>
                        <option value="STAFF">Cleaning Staff</option>
                    </select>
                </div>
                
                <button type="submit" class="btn btn-success w-100 mb-3">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>
            
            <div class="text-center mt-4">
                <p>Already have an account? <a th:href="@{/login}" class="text-success fw-600">Sign in</a></p>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
