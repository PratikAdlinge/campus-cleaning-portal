<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="fas fa-leaf"></i> Campus Cleaning
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="fas fa-bell"></i> Notifications</h3>
            <span class="badge bg-danger" th:text="${unreadCount} + ' unread'">0 unread</span>
        </div>
        
        <div class="card">
            <div class="card-body">
                <div class="list-group">
                    <div th:each="notification : ${notifications}" 
                         class="list-group-item list-group-item-action"
                         th:classappend="${!notification.isRead} ? 'bg-light' : ''">
                        <div class="d-flex w-100 justify-content-between align-items-start">
                            <div>
                                <h6 class="mb-1">
                                    <i class="fas fa-bell text-success" th:if="${!notification.isRead}"></i>
                                    <span th:text="${notification.title}">Title</span>
                                </h6>
                                <p class="mb-1" th:text="${notification.message}">Message</p>
                                <small class="text-muted" th:text="${#temporals.format(notification.createdAt, 'dd-MM-yyyy HH:mm')}">Date</small>
                            </div>
                            <form th:if="${notification.complaint}" th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post">
                                <a th:href="@{/student/complaint/{id}(id=${notification.complaint.id})}" class="btn btn-sm btn-outline-success">View</a>
                            </form>
                        </div>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-4 text-muted">
                        <i class="fas fa-bell-slash fa-3x mb-3"></i>
                        <p>No notifications</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
