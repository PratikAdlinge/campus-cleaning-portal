<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Complaint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="fas fa-leaf"></i> Campus Cleaning
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/student/dashboard}"><i class="fas fa-home me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}"><i class="fas fa-sign-out-alt me-1"></i> Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="page-header">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div>
                    <h1 class="page-title"><i class="fas fa-camera"></i> Report New Complaint</h1>
                    <p class="page-subtitle">Help us maintain a clean campus</p>
                </div>
                <a th:href="@{/student/complaints}" class="btn btn-outline-success">
                    <i class="fas fa-arrow-left"></i> Back
                </a>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="card">
                    <div class="card-header">
                        <h4><i class="fas fa-clipboard"></i> Complaint Details</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/student/complaint/save}" method="post" enctype="multipart/form-data">
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-heading"></i> Title *</label>
                                <input type="text" name="title" class="form-control" placeholder="Brief description of the issue" required>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-align-left"></i> Description *</label>
                                <textarea name="description" class="form-control" rows="4" 
                                          placeholder="Describe the cleanliness issue in detail..." required></textarea>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label"><i class="fas fa-map-marker-alt"></i> Location Type *</label>
                                        <select name="locationType" class="form-select" required>
                                            <option value="">Select Location</option>
                                            <option value="CLASSROOM">Classroom</option>
                                            <option value="CORRIDOR">Corridor</option>
                                            <option value="WASHROOM">Washroom</option>
                                            <option value="GARDEN">Garden</option>
                                            <option value="CANTEEN">Canteen</option>
                                            <option value="LIBRARY">Library</option>
                                            <option value="LAB">Laboratory</option>
                                            <option value="OFFICE">Office</option>
                                            <option value="PARKING">Parking</option>
                                            <option value="OTHER">Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label"><i class="fas fa-building"></i> Specific Location</label>
                                        <input type="text" name="specificLocation" class="form-control" 
                                               placeholder="e.g., Room 101, 2nd Floor">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-exclamation-circle"></i> Priority *</label>
                                <select name="priority" class="form-select" required>
                                    <option value="MEDIUM">Medium (Normal)</option>
                                    <option value="LOW">Low (Can wait)</option>
                                    <option value="HIGH">High (Urgent)</option>
                                    <option value="EMERGENCY">Emergency (Critical - water leakage, broken glass, etc.)</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label"><i class="fas fa-image"></i> Upload Before Cleaning Photo *</label>
                                <input type="file" name="image" class="form-control" accept="image/*" required 
                                       onchange="previewImage(event)">
                                <small class="text-muted">Upload a photo of the dirty area (before cleaning)</small>
                                <div class="mt-2">
                                    <img id="imagePreview" class="image-preview d-none" alt="Preview">
                                </div>
                            </div>
                            
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-success btn-lg">
                                    <i class="fas fa-paper-plane"></i> Submit Complaint
                                </button>
                                <a th:href="@{/student/complaints}" class="btn btn-outline-secondary">
                                    <i class="fas fa-times"></i> Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const preview = document.getElementById('imagePreview');
                preview.src = reader.result;
                preview.classList.remove('d-none');
            };
            reader.readAsDataURL(event.target.files[0]);
        }
    </script>
</body>
</html>
