<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">Campus Cleaning - Admin</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/users}">Users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6 mx-auto">
                <div class="card">
                    <div class="card-header">
                        <h4>User Details</h4>
                    </div>
                    <div class="card-body">
                        <p><strong>Name:</strong> <span th:text="${user.fullName}">Name</span></p>
                        <p><strong>Email:</strong> <span th:text="${user.email}">email</span></p>
                        <p><strong>Phone:</strong> <span th:text="${user.phone}">phone</span></p>
                        <p><strong>Department:</strong> <span th:text="${user.department}">dept</span></p>
                        <p><strong>Roll Number:</strong> <span th:text="${user.rollNumber}">roll</span></p>
                        <p><strong>Roles:</strong> 
                            <span th:each="role : ${user.roles}" class="badge bg-info me-1" th:text="${role.name}">ROLE</span>
                        </p>
                        <p><strong>Points:</strong> <span th:text="${user.points}">0</span></p>
                        <p><strong>Status:</strong> 
                            <span class="badge" th:classappend="${user.enabled} ? 'bg-success' : 'bg-danger'" th:text="${user.enabled} ? 'Active' : 'Inactive'">Active</span>
                        </p>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
