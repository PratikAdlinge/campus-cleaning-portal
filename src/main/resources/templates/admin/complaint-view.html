<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint Details - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">Campus Cleaning - Admin</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/admin/complaints}">Complaints</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h4>Complaint #<span th:text="${complaint.id}">1</span></h4>
                        <span class="status-badge" th:classappend="'status-' + ${complaint.status}" th:text="${complaint.status}">PENDING</span>
                    </div>
                    <div class="card-body">
                        <h5 th:text="${complaint.title}">Title</h5>
                        <p class="text-muted">
                            <i class="fas fa-map-marker-alt"></i> 
                            <span th:text="${complaint.locationType}">CLASSROOM</span>
                            <span th:if="${complaint.specificLocation}"> - <span th:text="${complaint.specificLocation}">Location</span></span>
                        </p>
                        
                        <hr>
                        <h6>Description</h6>
                        <p th:text="${complaint.description}">Description...</p>
                        
                        <div th:if="${complaint.imagePath}" class="mt-3">
                            <h6>Before Cleaning Photo</h6>
                            <img th:src="${complaint.imagePath}" class="complaint-image" style="max-width: 400px;" alt="Before Cleaning Image">
                        </div>
                        
                        <div th:if="${complaint.afterImagePath}" class="mt-3">
                            <h6>After Cleaning Photo</h6>
                            <img th:src="${complaint.afterImagePath}" class="complaint-image" style="max-width: 400px;" alt="After Cleaning Image">
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><h6>Complaint Info</h6></div>
                    <div class="card-body">
                        <p><strong>Priority:</strong> <span class="priority-badge" th:classappend="'priority-' + ${complaint.priority}" th:text="${complaint.priority}">MEDIUM</span></p>
                        <p><strong>Created:</strong> <span th:text="${#temporals.format(complaint.createdAt, 'dd-MM-yyyy HH:mm')}">Date</span></p>
                        <p><strong>Reported By:</strong> <span th:text="${complaint.user?.fullName}">Student</span></p>
                        <p><strong>Assigned To:</strong> <span th:text="${complaint.staff?.fullName}">-</span></p>
                        <p th:if="${complaint.completedAt}"><strong>Completed:</strong> <span th:text="${#temporals.format(complaint.completedAt, 'dd-MM-yyyy HH:mm')}">Date</span></p>
                    </div>
                </div>
                
                <!-- Assign Staff -->
                <div class="card mt-3" th:if="${complaint.status.name() == 'PENDING'}">
                    <div class="card-header"><h6>Assign Staff</h6></div>
                    <div class="card-body">
                        <form th:action="@{/admin/complaint/{id}/assign(id=${complaint.id})}" method="post">
                            <div class="mb-3">
                                <select name="staffId" class="form-select" required>
                                    <option value="">Select Staff</option>
                                    <option th:each="staff : ${staffList}" th:value="${staff.id}" th:text="${staff.fullName}">Staff</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success w-100">Assign</button>
                        </form>
                        <form th:action="@{/admin/complaint/{id}/auto-assign(id=${complaint.id})}" method="post" class="mt-2">
                            <button type="submit" class="btn btn-outline-success w-100">Auto Assign</button>
                        </form>
                    </div>
                </div>
                
                <a th:href="@{/admin/complaints}" class="btn btn-outline-secondary w-100 mt-3">Back</a>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
